name: Backend and AI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "src/**"
      - "tests/**"
      - "config/**"
      - "examples/**"
      - "pyproject.toml"
      - "docs/backend-api.md"
      - "docs/evaluation/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "src/**"
      - "tests/**"
      - "config/**"
      - "examples/**"
      - "pyproject.toml"
      - "docs/backend-api.md"
      - "docs/evaluation/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
      - name: Install
        run: python -m pip install -e "..[dev]" -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check once_wrong tests
      - name: API tests
        run: python -m pytest -q
      - name: AI and rule tests
        run: python -m pytest ../tests -q
