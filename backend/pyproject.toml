[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "once-wrong-backend"
version = "0.2.0"
description = "Persistent Once Wrong validation and AI review API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "python-multipart>=0.0.20,<0.1",
  "pydantic>=2.9,<3",
  "once-wrong>=0.1.0,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["once_wrong", "once_wrong.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["once_wrong", "once_wrong_ai"]
