[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "once-wrong"
version = "0.1.0"
description = "Cardif InsurHack 2026 題目 6-2：資料品質與檢核助手原型"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pypdf>=5",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
once-wrong-review = "once_wrong_ai.ai_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["once_wrong_ai", "once_wrong_ai.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
